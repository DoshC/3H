<!-- MODAL REGISTRO -->
<div id="registerModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:center; justify-content:center;">
  <div style="background:#fff; padding:48px; border-radius:12px; max-width:400px; width:90%;">
    <h2 style="margin-bottom:24px; font-family:'Crimson Text', serif;">Crear Cuenta</h2>
    <form id="registerForm">
      <input type="text" id="regName" placeholder="Tu nombre" required style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:6px; font-family:Inter;">
      <input type="email" id="regEmail" placeholder="tu@email.com" required style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:6px; font-family:Inter;">
      <input type="password" id="regPassword" placeholder="Contraseña" required style="width:100%; padding:12px; margin-bottom:24px; border:1px solid #ddd; border-radius:6px; font-family:Inter;">
      <button type="submit" class="btn btn-primary" style="width:100%; margin-bottom:12px;">Registrarse</button>
      <button type="button" onclick="closeRegisterModal()" style="width:100%; padding:12px; background:#f0f0f0; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Cerrar</button>
    </form>
    <p id="registerMessage" style="margin-top:12px; text-align:center; color:green; font-size:0.9rem;"></p>
  </div>
</div>

<!-- MODAL LOGIN -->

      <button type="submit" class="btn btn-primary" style="width:100%; margin-bottom:12px;">Inicia Sesión</button>
